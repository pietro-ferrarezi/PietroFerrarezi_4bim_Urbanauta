<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Urbanauta</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="../public/index.css" />
  </head>
  <body>
    <header>
      <a href="/" class="brand">
        <h1 class="brandname">
          <span class="brandname--highlight">Urban</span>auta
        </h1>
      </a>
      <nav class="menu">
        <div class="menu__item menu__item--selected">
          <p>Inicio</p>
        </div>
        <div class="menu__item">
          <p>Iniciativas</p>
        </div>
        <div class="menu__item">
          <p>Sobre</p>
        </div>
        <div class="menu__item">
          <p>Doe</p>
        </div>
      </nav>
      <div class="user">
        <button class="btt-login primary-btt">Entrar</button>
      </div>
    </header>
    <main>
      <section class="welcome">
        <div class="welcome__hero">
          <div class="hero__left">
            <img
              src="../Imagens_paginas/letreiro.png"
              alt="Cidades mais verdes começam com pessoas"
              style="width: 30vw; height: auto"
            />
            <button class="primary-btt hero__btt">
              Participe das Iniciativas -->
            </button>
          </div>
          <div class="hero__right">
            <img
              src="../Imagens_paginas/imagem_lateral.png"
              style="width: 48vw; height: auto"
            />
          </div>
        </div>
        <div class="welcome__features">
          <div class="features__item">
            <div class="f__item__imagem">
              <img src="../Imagens_paginas/icon_plant.png" />
            </div>
            <div class="f__item__content">
              <p class="i__content__title">Projetos</p>
              <p class="i__content__description">
                Conheça o que está acontecendo
              </p>
            </div>
          </div>
          <div class="features__item">
            <div class="f__item__imagem">
              <img src="../Imagens_paginas/icon_earth.png" />
            </div>
            <div class="f__item__content">
              <p class="i__content__title">Atividades</p>
              <p class="i__content__description">Participe das ações ao seu redor</p>
            </div>
          </div>
          <div class="features__item">
            <div class="f__item__imagem">
              <img src="../Imagens_paginas/icon_papers.png" />
            </div>
            <div class="f__item__content">
              <p class="i__content__title">Petições</p>
              <p class="i__content__description">Faça com que ouçam sua voz</p>
            </div>
          </div>
          <div class="features__item">
            <div class="f__item__imagem">
              <img src="../Imagens_paginas/icon_community.png" />
            </div>
            <div class="f__item__content">
              <p class="i__content__title">Comunidade</p>
              <p class="i__content__description">Junte-se a quem faz</p>
            </div>
          </div>
        </div>
      </section>
      <section class="projetos">
        <h2>Projetos em Destaque</h2>
      </section>
    </main>
  </body>
</html>
